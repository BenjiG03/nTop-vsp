[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ntop-vsp"
version = "0.4.0"
description = "Drivers for the nTop_vsp custom blocks: nTop implicit bodies to OpenVSP models, VSPAERO, Wave Drag, Parasite Drag, Modified Newtonian, flight conditions, aero databases and polar plots"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["ambiance", "matplotlib", "numpy>=2"]

[project.optional-dependencies]
test = ["pytest", "scipy"]

[tool.setuptools]
packages = ["vsp_ntop"]

[tool.setuptools.package-data]
vsp_ntop = ["rasaero_ui/*.cs", "rasaero_ui/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs nTop blocks through ntopcl (needs nTop, signed in)"]
